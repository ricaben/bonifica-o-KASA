name: Gerar APK Kasa Gestao

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto Android
        run: |
          unzip -o Bonus_Kasa_Esfihas_Projeto_Android_Automatizado.zip
          ls -la
          find . -maxdepth 3 -name settings.gradle -print

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        working-directory: BonusKasaEsfihasAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasa-Gestao-APK
          path: BonusKasaEsfihasAndroid/app/build/outputs/apk/debug/app-debug.apk
